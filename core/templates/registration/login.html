{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Office Hub</title>
    <meta name="color-scheme" content="dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="{% static 'core/css/theme.css' %}" rel="stylesheet">
</head>
<body>
<main class="auth">
    <div class="card auth-card">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </span>
            Office Hub
        </div>
        <h1 style="font-size: 22px; margin-bottom: 4px;">Log in</h1>
        <p class="muted" style="margin: 0 0 20px;">Use your team account to manage tasks.</p>

        <form method="POST" novalidate>
            {% csrf_token %}

            {% if form.errors %}
            <div class="form-error-box" role="alert">Username or password is wrong. Check both and try again.</div>
            {% endif %}

            <div class="field">
                <label for="{{ form.username.id_for_label }}">Username</label>
                <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" autocomplete="username" autofocus required>
            </div>
            <div class="field">
                <label for="{{ form.password.id_for_label }}">Password</label>
                <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" autocomplete="current-password" required>
            </div>

            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>
        <p class="muted" style="margin: 16px 0 0; text-align: center;"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
    </div>
</main>
</body>
</html>
