<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>📊 Task Reports</h2>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary mb-3">Back to Dashboard</a>

        <!-- Status filter (view pehle se ?status= support karta tha, UI nahi tha) -->
        <form method="GET" class="mb-3 d-flex gap-2" style="max-width: 360px;">
            <select name="status" class="form-select">
                <option value="">All statuses</option>
                {% for value, label in status_choices %}
                    <option value="{{ value }}" {% if value == status_filter %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn btn-primary">Filter</button>
        </form>

        <div class="card p-3 shadow-sm">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Assigned To</th>
                        <th>Status</th>
                        <th>Due Date</th>
                    </tr>
                </thead>
                <tbody>
                    {% for task in tasks %}
                    <tr>
                        <td>{{ task.title }}</td>
                        <td>{{ task.assigned_to.username }}</td>
                        <td>{{ task.status }}</td>
                        <td>{{ task.due_date|default:"-" }}</td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="text-center">No tasks found.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
