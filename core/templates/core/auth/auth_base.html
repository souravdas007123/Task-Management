{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Account{% endblock %} - Task Management</title>
    <meta name="color-scheme" content="dark">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="{% static 'core/css/theme.css' %}" rel="stylesheet">
</head>
<body>
<main class="auth">
    <div class="card auth-card">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
            Taskboard
        </div>
        {% block body %}{% endblock %}
    </div>
</main>
</body>
</html>
