{% if form.non_field_errors %}<div class="form-error-box" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
    {{ field.errors }}
</div>
{% endfor %}
